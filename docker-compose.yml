services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    env_file: .env #POSTGRES_PASSWORD
    networks:
      - main_network

    # healthcheck:
    #   test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 3

# only for development, not for production because of security reasons
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - main_network
