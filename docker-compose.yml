# *************************************************************************** #
#                             Docker Compose File
# *************************************************************************** #

networks:
  frontend_network:
  db_network:

# survives `make down`, wiped by `make nuke-db`
volumes:
  db_data:
  caddy_data:
  caddy_config:

# secrets:
#   db_user_password:
#     file: ../secrets/example.txt


services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
      build: ./Backend
      restart: unless-stopped
      # env_file: .env
      depends_on:
        db:
          condition: service_healthy
      networks:
        - frontend_network
        - db_network

  frontend:
    build: ./Frontend
    restart: unless-stopped
    # ports:
    #   - 5173:5173   # direct access for testing; remove once Caddy proxies to it
    networks:
      - frontend_network


  caddy:
    image: caddy:alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "8001:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - $PWD/Proxy:/etc/caddy
      - $PWD/site:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_network



# only for development, not for production because of security reasons
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      - db_network
