# *************************************************************************** #
#                             Docker Compose File
# *************************************************************************** #

networks:
  main_network:
    name: main_network

# survives `make down`, wiped by `make nuke-db`
volumes:
  db_data:

# secrets:
#   db_user_password:
#     file: ../secrets/example.txt


services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - main_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
      build: ./Backend
      restart: unless-stopped
      # env_file: .env
      depends_on:
        db:
          condition: service_healthy
      # ports:
      #   - 3000:3000
      networks:
        - main_network


# only for development, not for production because of security reasons
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      - main_network
