# *************************************************************************** #
#                             Docker Compose File
# *************************************************************************** #

networks:
  caddy_network:
  db_network:

volumes:
  db_data: # the real database storage

  caddy_data:
  caddy_config:

services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - db_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build: ./Backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./books:/books:ro
    networks:
      - caddy_network
      - db_network

  frontend-caddy:
    build: ./Frontend
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "8443:443"
    volumes:
      - ./Proxy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_network

  # only for development, not for production because of security reasons
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      - db_network
