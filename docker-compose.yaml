# *************************************************************************** #
#                             Docker Compose File
# *************************************************************************** #

name: bookwurms

networks:
  db_network:
  caddy_network:

volumes:
  db_data: # the real database storage
  caddy_data:
  caddy_config:

services:
  #
  # Final Production Services:
  #
  postgres-db:
    image: postgres:18-alpine3.24
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - db_network

    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  go-backend:
    build: ./Backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./books:/books
    networks:
      - caddy_network
      - db_network

    depends_on:
      postgres-db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:50000/api/health" ]
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # TODO: the old one remove me latter
  # frontend-caddy:
  #   build:
  #     context: ./Frontend
  #   restart: unless-stopped

  #   volumes:
  #     - ./Proxy:/etc/caddy
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - caddy_network
  #   ports:
  #     - "8443:443"

  #   cap_add:
  #     - NET_ADMIN

  # TODO: svelte version of caddy, rename to frontend-caddy latter
  caddy-frontend:
    build:
      context: ./Frontend2
      target: prod
    restart: unless-stopped

    volumes:
      - ./Proxy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_network
    ports:
      - "8444:443"

    cap_add:
      - NET_ADMIN

  #
  # DEVELOPMENT Services:
  #

  # node:26-alpine needed to run Vite. without this, each person needs to install it themselves.
  vite-frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./Frontend2
      target: dev
    environment:
      API_TARGET: http://go-backend:50000

    volumes:
      - ./Frontend2/src:/app/src
      - ./Frontend2/static:/app/static
    networks:
      - caddy_network
    ports:
      - "127.0.0.1:5173:5173"

  # only for development, not for production because of security reasons
  adminer-dev:
    profiles: [ "dev" ]
    image: adminer:latest
    restart: unless-stopped

    networks:
      - db_network
    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres-db:
        condition: service_healthy

  #
  # TEST Services:
  #

  # TODO: only for development, maybe remove later; This db is entirely for testing database writes and reads without modifying the real database
  postgres-db-test:
    profiles: [ "test" ]
    image: postgres:18-alpine3.24
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: post_db_test

    networks:
      - db_network
    ports:
      - "127.0.0.1:5433:5432"

    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d post_db_test" ]
      interval: 2s
      timeout: 5s
      retries: 10
